<div class="form-group">
    <label for="organizationId" class="form-label">School District:</label>
    <select id="organizationId" name="organizationId" class="form-input" required disabled>
        <option value="">Loading school districts...</option>
    </select>
    <input type="hidden" id="organizationName" name="organizationName">
</div>

<div class="form-group">
    <label for="schoolId" class="form-label">School 1:</label>
    <select id="schoolId" name="schoolId" class="form-input" required disabled>
        <option value="">Loading schools...</option>
    </select>
    <input type="hidden" id="schoolName" name="schoolName">
</div>

<div class="form-group">
    <label for="menuId" class="form-label">Menu 1:</label>
    <select id="menuId" name="menuId" class="form-input" required disabled>
        <option value="">Select a school first</option>
    </select>
    <input type="hidden" id="menuName" name="menuName">
</div>

<div class="form-group">
    <label for="secondSchoolId" class="form-label">School 2 (optional):</label>
    <select id="secondSchoolId" name="secondSchoolId" class="form-input" disabled>
        <option value="">Select a school district first</option>
    </select>
    <input type="hidden" id="secondSchoolName" name="secondSchoolName">
</div>

<div class="form-group">
    <label for="secondMenuId" class="form-label">Menu 2:</label>
    <select id="secondMenuId" name="secondMenuId" class="form-input" disabled>
        <option value="">Select a second school first</option>
    </select>
    <input type="hidden" id="secondMenuName" name="secondMenuName">
</div>

<div id="schoolMenuError" class="form-group" role="alert" style="display: none;"></div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const organizationSelect = document.getElementById('organizationId');
        const organizationName = document.getElementById('organizationName');
        const errorMessage = document.getElementById('schoolMenuError');
        const settingsDataUrl = "{{ url_for('plugin.plugin_settings_data', plugin_id='school_menu', resource='') }}";
        const selections = [
            {
                school: document.getElementById('schoolId'),
                schoolName: document.getElementById('schoolName'),
                menu: document.getElementById('menuId'),
                menuName: document.getElementById('menuName'),
                schoolPlaceholder: 'Select a school',
                menuPlaceholder: 'Select a menu'
            },
            {
                school: document.getElementById('secondSchoolId'),
                schoolName: document.getElementById('secondSchoolName'),
                menu: document.getElementById('secondMenuId'),
                menuName: document.getElementById('secondMenuName'),
                schoolPlaceholder: 'No second school',
                menuPlaceholder: 'Select a second menu'
            }
        ];

        function selectedText(select) {
            return select.selectedIndex >= 0
                ? select.options[select.selectedIndex].text
                : '';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function clearError() {
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
        }

        async function loadOptions(resource, query = '') {
            const response = await fetch(`${settingsDataUrl}${resource}${query}`);
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || 'Unable to load options.');
            }
            return payload.data;
        }

        function populate(select, items, placeholder, formatName = item => item.name) {
            select.replaceChildren(new Option(placeholder, ''));
            items.forEach(item => select.add(new Option(formatName(item), item.id)));
            select.disabled = false;
            $(select).trigger('change.select2');
        }

        function resetSelection(selection, schoolMessage) {
            selection.school.disabled = true;
            selection.school.replaceChildren(new Option(schoolMessage, ''));
            selection.schoolName.value = '';
            selection.menu.disabled = true;
            selection.menu.replaceChildren(new Option('Select a school first', ''));
            selection.menuName.value = '';
            $(selection.school).trigger('change.select2');
            $(selection.menu).trigger('change.select2');
        }

        async function loadSchools(selectedSchoolIds = ['', '']) {
            clearError();
            selections.forEach(selection => resetSelection(selection, 'Loading schools...'));

            if (!organizationSelect.value) {
                selections.forEach(selection => {
                    resetSelection(selection, 'Select a school district first');
                });
                return;
            }

            try {
                const schools = await loadOptions(
                    'schools',
                    `?organization_id=${encodeURIComponent(organizationSelect.value)}`
                );
                selections.forEach((selection, index) => {
                    const placeholder = schools.length
                        ? selection.schoolPlaceholder
                        : 'No schools available';
                    populate(selection.school, schools, placeholder);
                    selection.school.disabled = schools.length === 0;
                    if (selectedSchoolIds[index]) {
                        selection.school.value = String(selectedSchoolIds[index]);
                        $(selection.school).trigger('change.select2');
                    }
                    selection.schoolName.value = selectedText(selection.school);
                });
            } catch (error) {
                selections.forEach(selection => {
                    resetSelection(selection, 'Unable to load schools');
                });
                showError(error.message);
            }
        }

        async function loadMenus(selection, selectedMenuId = '') {
            clearError();
            selection.menu.disabled = true;
            selection.menu.replaceChildren(new Option('Loading menus...', ''));
            selection.menuName.value = '';
            $(selection.menu).trigger('change.select2');

            if (!selection.school.value) {
                selection.menu.replaceChildren(new Option('Select a school first', ''));
                $(selection.menu).trigger('change.select2');
                return;
            }

            try {
                const menus = await loadOptions(
                    'menus',
                    `?organization_id=${encodeURIComponent(organizationSelect.value)}&school_id=${encodeURIComponent(selection.school.value)}`
                );
                populate(selection.menu, menus, menus.length ? selection.menuPlaceholder : 'No menus available');
                selection.menu.disabled = menus.length === 0;
                if (selectedMenuId) {
                    selection.menu.value = String(selectedMenuId);
                    $(selection.menu).trigger('change.select2');
                }
                selection.menuName.value = selectedText(selection.menu);
            } catch (error) {
                selection.menu.replaceChildren(new Option('Unable to load menus', ''));
                $(selection.menu).trigger('change.select2');
                showError(error.message);
            }
        }

        $(organizationSelect).on('change', async () => {
            organizationName.value = selectedText(organizationSelect);
            await loadSchools();
        });
        selections.forEach(selection => {
            $(selection.school).on('change', async () => {
                selection.schoolName.value = selectedText(selection.school);
                await loadMenus(selection);
            });
            $(selection.menu).on('change', () => {
                selection.menuName.value = selectedText(selection.menu);
            });
        });

        try {
            const organizations = await loadOptions('organizations');
            populate(
                organizationSelect,
                organizations,
                'Select a school district',
                organization => `${organization.name} (${organization.state})`
            );
            $(organizationSelect).select2({
                placeholder: 'Search for a school district',
                width: '100%'
            });
            selections.forEach(selection => {
                $(selection.school).select2({
                    placeholder: selection.schoolPlaceholder,
                    width: '100%'
                });
                $(selection.menu).select2({
                    placeholder: selection.menuPlaceholder,
                    width: '100%'
                });
            });

            if (loadPluginSettings) {
                // Instances created before district selection was added were Bellevue (ID 99).
                organizationSelect.value = String(pluginSettings.organizationId || '99');
                $(organizationSelect).trigger('change.select2');
                organizationName.value = pluginSettings.organizationName || selectedText(organizationSelect);
                await loadSchools([
                    pluginSettings.schoolId || '',
                    pluginSettings.secondSchoolId || ''
                ]);
                await Promise.all([
                    loadMenus(selections[0], pluginSettings.menuId || ''),
                    loadMenus(selections[1], pluginSettings.secondMenuId || '')
                ]);
                selections[0].schoolName.value = pluginSettings.schoolName || selectedText(selections[0].school);
                selections[0].menuName.value = pluginSettings.menuName || selectedText(selections[0].menu);
                selections[1].schoolName.value = pluginSettings.secondSchoolName || selectedText(selections[1].school);
                selections[1].menuName.value = pluginSettings.secondMenuName || selectedText(selections[1].menu);
            }
        } catch (error) {
            organizationSelect.replaceChildren(new Option('Unable to load school districts', ''));
            showError(error.message);
        }
    });
</script>
