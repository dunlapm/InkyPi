<div class="form-group">
    <label for="organizationName" class="form-label">School District:</label>
    <input
        type="text"
        id="organizationName"
        name="organizationName"
        class="form-input"
        list="organizationOptions"
        placeholder="Type to search..."
        required
        disabled
    >
    <datalist id="organizationOptions"></datalist>
    <input type="hidden" id="organizationId" name="organizationId">
</div>

<div class="form-group">
    <label for="menuCutoffTime" class="form-label">Show Next Menu After:</label>
    <input
        type="time"
        id="menuCutoffTime"
        name="menuCutoffTime"
        class="form-input"
        value="12:00"
        required
    >
</div>

<div class="form-group">
    <label for="schoolName" class="form-label">School 1:</label>
    <input
        type="text"
        id="schoolName"
        name="schoolName"
        class="form-input"
        list="schoolOptions"
        placeholder="Type to search..."
        required
        disabled
    >
    <datalist id="schoolOptions"></datalist>
    <input type="hidden" id="schoolId" name="schoolId">
</div>

<div class="form-group">
    <label for="menuName" class="form-label">Menu 1:</label>
    <input
        type="text"
        id="menuName"
        name="menuName"
        class="form-input"
        list="menuOptions"
        placeholder="Type to search..."
        required
        disabled
    >
    <datalist id="menuOptions"></datalist>
    <input type="hidden" id="menuId" name="menuId">
</div>

<div class="form-group">
    <label for="secondSchoolName" class="form-label">School 2 (optional):</label>
    <input
        type="text"
        id="secondSchoolName"
        name="secondSchoolName"
        class="form-input"
        list="secondSchoolOptions"
        placeholder="Type to search..."
        disabled
    >
    <datalist id="secondSchoolOptions"></datalist>
    <input type="hidden" id="secondSchoolId" name="secondSchoolId">
</div>

<div class="form-group">
    <label for="secondMenuName" class="form-label">Menu 2:</label>
    <input
        type="text"
        id="secondMenuName"
        name="secondMenuName"
        class="form-input"
        list="secondMenuOptions"
        placeholder="Type to search..."
        disabled
    >
    <datalist id="secondMenuOptions"></datalist>
    <input type="hidden" id="secondMenuId" name="secondMenuId">
</div>

<div id="schoolMenuError" class="form-group" role="alert" style="display: none;"></div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const organizationInput = document.getElementById('organizationName');
        const organizationId = document.getElementById('organizationId');
        const organizationOptions = document.getElementById('organizationOptions');
        const menuCutoffTime = document.getElementById('menuCutoffTime');
        const errorMessage = document.getElementById('schoolMenuError');
        const settingsDataUrl = "{{ url_for('plugin.plugin_settings_data', plugin_id='school_menu', resource='') }}";
        const selections = [
            {
                schoolInput: document.getElementById('schoolName'),
                schoolId: document.getElementById('schoolId'),
                schoolOptions: document.getElementById('schoolOptions'),
                menuInput: document.getElementById('menuName'),
                menuId: document.getElementById('menuId'),
                menuOptions: document.getElementById('menuOptions'),
                schools: [],
                menus: []
            },
            {
                schoolInput: document.getElementById('secondSchoolName'),
                schoolId: document.getElementById('secondSchoolId'),
                schoolOptions: document.getElementById('secondSchoolOptions'),
                menuInput: document.getElementById('secondMenuName'),
                menuId: document.getElementById('secondMenuId'),
                menuOptions: document.getElementById('secondMenuOptions'),
                schools: [],
                menus: []
            }
        ];
        let organizations = [];

        function organizationLabel(organization) {
            return `${organization.name} (${organization.state})`;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function clearError() {
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
        }

        async function loadOptions(resource, query = '') {
            const response = await fetch(`${settingsDataUrl}${resource}${query}`);
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || 'Unable to load options.');
            }
            return payload.data;
        }

        function populateDatalist(datalist, items, label = item => item.name) {
            datalist.replaceChildren(
                ...items.map(item => new Option(label(item)))
            );
        }

        function findByInput(items, input, label = item => item.name) {
            return items.find(item => label(item) === input.value) || null;
        }

        function setSelection(input, idInput, items, selectedId, label = item => item.name) {
            const selected = items.find(item => String(item.id) === String(selectedId));
            input.value = selected ? label(selected) : '';
            idInput.value = selected ? selected.id : '';
        }

        function resetMenus(selection) {
            selection.menus = [];
            selection.menuInput.value = '';
            selection.menuId.value = '';
            selection.menuInput.disabled = true;
            selection.menuOptions.replaceChildren();
        }

        function resetSchools() {
            selections.forEach(selection => {
                selection.schools = [];
                selection.schoolInput.value = '';
                selection.schoolId.value = '';
                selection.schoolInput.disabled = true;
                selection.schoolOptions.replaceChildren();
                resetMenus(selection);
            });
        }

        async function loadSchools(selectedSchoolIds = ['', '']) {
            clearError();
            resetSchools();
            if (!organizationId.value) {
                return;
            }

            try {
                const schools = await loadOptions(
                    'schools',
                    `?organization_id=${encodeURIComponent(organizationId.value)}`
                );
                selections.forEach((selection, index) => {
                    selection.schools = schools;
                    populateDatalist(selection.schoolOptions, schools);
                    selection.schoolInput.disabled = schools.length === 0;
                    setSelection(
                        selection.schoolInput,
                        selection.schoolId,
                        schools,
                        selectedSchoolIds[index]
                    );
                });
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadMenus(selection, selectedMenuId = '') {
            clearError();
            resetMenus(selection);
            if (!organizationId.value || !selection.schoolId.value) {
                return;
            }

            try {
                const menus = await loadOptions(
                    'menus',
                    `?organization_id=${encodeURIComponent(organizationId.value)}&school_id=${encodeURIComponent(selection.schoolId.value)}`
                );
                selection.menus = menus;
                populateDatalist(selection.menuOptions, menus);
                selection.menuInput.disabled = menus.length === 0;
                setSelection(
                    selection.menuInput,
                    selection.menuId,
                    menus,
                    selectedMenuId
                );
            } catch (error) {
                showError(error.message);
            }
        }

        organizationInput.addEventListener('input', () => {
            const selected = findByInput(
                organizations,
                organizationInput,
                organizationLabel
            );
            organizationId.value = selected ? selected.id : '';
        });
        organizationInput.addEventListener('change', async () => {
            const selected = findByInput(
                organizations,
                organizationInput,
                organizationLabel
            );
            organizationId.value = selected ? selected.id : '';
            await loadSchools();
            if (!selected && organizationInput.value) {
                showError('Select a school district from the list.');
            }
        });

        selections.forEach(selection => {
            selection.schoolInput.addEventListener('input', () => {
                const selected = findByInput(
                    selection.schools,
                    selection.schoolInput
                );
                selection.schoolId.value = selected ? selected.id : '';
            });
            selection.schoolInput.addEventListener('change', async () => {
                const selected = findByInput(
                    selection.schools,
                    selection.schoolInput
                );
                selection.schoolId.value = selected ? selected.id : '';
                await loadMenus(selection);
                if (!selected && selection.schoolInput.value) {
                    showError('Select a school from the list.');
                }
            });
            selection.menuInput.addEventListener('input', () => {
                const selected = findByInput(
                    selection.menus,
                    selection.menuInput
                );
                selection.menuId.value = selected ? selected.id : '';
            });
            selection.menuInput.addEventListener('change', () => {
                const selected = findByInput(
                    selection.menus,
                    selection.menuInput
                );
                selection.menuId.value = selected ? selected.id : '';
                if (!selected && selection.menuInput.value) {
                    showError('Select a menu from the list.');
                }
            });
        });

        try {
            organizations = await loadOptions('organizations');
            populateDatalist(
                organizationOptions,
                organizations,
                organizationLabel
            );
            organizationInput.disabled = organizations.length === 0;

            if (loadPluginSettings) {
                menuCutoffTime.value = pluginSettings.menuCutoffTime || '12:00';
                const selectedOrganizationId = pluginSettings.organizationId || '99';
                setSelection(
                    organizationInput,
                    organizationId,
                    organizations,
                    selectedOrganizationId,
                    organizationLabel
                );
                await loadSchools([
                    pluginSettings.schoolId || '',
                    pluginSettings.secondSchoolId || ''
                ]);
                await Promise.all([
                    loadMenus(selections[0], pluginSettings.menuId || ''),
                    loadMenus(selections[1], pluginSettings.secondMenuId || '')
                ]);
            }
        } catch (error) {
            organizationInput.disabled = true;
            showError(error.message);
        }
    });
</script>
