<div class="form-group">
    <label for="organizationId" class="form-label">School District:</label>
    <select id="organizationId" name="organizationId" class="form-input" required disabled>
        <option value="">Loading school districts...</option>
    </select>
    <input type="hidden" id="organizationName" name="organizationName">
</div>

<div class="form-group">
    <label for="schoolId" class="form-label">School:</label>
    <select id="schoolId" name="schoolId" class="form-input" required disabled>
        <option value="">Loading schools...</option>
    </select>
    <input type="hidden" id="schoolName" name="schoolName">
</div>

<div class="form-group">
    <label for="menuId" class="form-label">Menu:</label>
    <select id="menuId" name="menuId" class="form-input" required disabled>
        <option value="">Select a school first</option>
    </select>
    <input type="hidden" id="menuName" name="menuName">
</div>

<div id="schoolMenuError" class="form-group" role="alert" style="display: none;"></div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const organizationSelect = document.getElementById('organizationId');
        const schoolSelect = document.getElementById('schoolId');
        const menuSelect = document.getElementById('menuId');
        const organizationName = document.getElementById('organizationName');
        const schoolName = document.getElementById('schoolName');
        const menuName = document.getElementById('menuName');
        const errorMessage = document.getElementById('schoolMenuError');
        const settingsDataUrl = "{{ url_for('plugin.plugin_settings_data', plugin_id='school_menu', resource='') }}";

        function selectedText(select) {
            return select.selectedIndex >= 0
                ? select.options[select.selectedIndex].text
                : '';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        async function loadOptions(resource, query = '') {
            const response = await fetch(`${settingsDataUrl}${resource}${query}`);
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || 'Unable to load options.');
            }
            return payload.data;
        }

        function populate(select, items, placeholder, formatName = item => item.name) {
            select.replaceChildren(new Option(placeholder, ''));
            items.forEach(item => select.add(new Option(formatName(item), item.id)));
            select.disabled = false;
        }

        async function loadSchools(selectedSchoolId = '') {
            schoolSelect.disabled = true;
            schoolSelect.replaceChildren(new Option('Loading schools...', ''));
            schoolName.value = '';
            menuSelect.disabled = true;
            menuSelect.replaceChildren(new Option('Select a school first', ''));
            menuName.value = '';

            if (!organizationSelect.value) {
                schoolSelect.replaceChildren(new Option('Select a school district first', ''));
                return;
            }

            try {
                const schools = await loadOptions(
                    'schools',
                    `?organization_id=${encodeURIComponent(organizationSelect.value)}`
                );
                populate(schoolSelect, schools, schools.length ? 'Select a school' : 'No schools available');
                schoolSelect.disabled = schools.length === 0;
                if (selectedSchoolId) {
                    schoolSelect.value = String(selectedSchoolId);
                }
                schoolName.value = selectedText(schoolSelect);
            } catch (error) {
                schoolSelect.replaceChildren(new Option('Unable to load schools', ''));
                showError(error.message);
            }
        }

        async function loadMenus(selectedMenuId = '') {
            menuSelect.disabled = true;
            menuSelect.replaceChildren(new Option('Loading menus...', ''));
            menuName.value = '';

            if (!schoolSelect.value) {
                menuSelect.replaceChildren(new Option('Select a school first', ''));
                return;
            }

            try {
                const menus = await loadOptions(
                    'menus',
                    `?organization_id=${encodeURIComponent(organizationSelect.value)}&school_id=${encodeURIComponent(schoolSelect.value)}`
                );
                populate(menuSelect, menus, menus.length ? 'Select a menu' : 'No menus available');
                menuSelect.disabled = menus.length === 0;
                if (selectedMenuId) {
                    menuSelect.value = String(selectedMenuId);
                }
                menuName.value = selectedText(menuSelect);
            } catch (error) {
                menuSelect.replaceChildren(new Option('Unable to load menus', ''));
                showError(error.message);
            }
        }

        $(organizationSelect).on('change', async () => {
            organizationName.value = selectedText(organizationSelect);
            await loadSchools();
        });
        $(schoolSelect).on('change', async () => {
            schoolName.value = selectedText(schoolSelect);
            await loadMenus();
        });
        $(menuSelect).on('change', () => {
            menuName.value = selectedText(menuSelect);
        });

        try {
            const organizations = await loadOptions('organizations');
            populate(
                organizationSelect,
                organizations,
                'Select a school district',
                organization => `${organization.name} (${organization.state})`
            );
            $(organizationSelect).select2({
                placeholder: 'Search for a school district',
                width: '100%'
            });

            if (loadPluginSettings) {
                // Instances created before district selection was added were Bellevue (ID 99).
                organizationSelect.value = String(pluginSettings.organizationId || '99');
                organizationName.value = pluginSettings.organizationName || selectedText(organizationSelect);
                await loadSchools(pluginSettings.schoolId || '');
                schoolName.value = pluginSettings.schoolName || selectedText(schoolSelect);
                await loadMenus(pluginSettings.menuId || '');
                menuName.value = pluginSettings.menuName || selectedText(menuSelect);
            }
        } catch (error) {
            organizationSelect.replaceChildren(new Option('Unable to load school districts', ''));
            showError(error.message);
        }
    });
</script>
